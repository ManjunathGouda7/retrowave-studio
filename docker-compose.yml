version: '3.8'

services:
  # Retrowave Studio Enterprise FastAPI Microservice
  api:
    build: .
    container_name: retrowave-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUTF8=1
    restart: unless-stopped

  # Retrowave Studio Streamlit Interactive UI
  web:
    build: .
    container_name: retrowave-web
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - PYTHONUTF8=1
    depends_on:
      - api
    restart: unless-stopped
